spring:
  application:
    name: tenantflow-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tenantflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        tenant_identifier_resolver: org.example.config.multitenancy.TenantIdentifierResolver
        multi_tenant_connection_provider: org.example.config.multitenancy.TenantConnectionProvider

  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8081}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET_KEY:bu-bizim-cok-gizli-ve-guvenli-jwt-anahtarimiz-1234567890}
  expiration: ${JWT_EXPIRATION:900000} # 15 minutes in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds
services:
  postgres:
    image: postgres:15-alpine
    container_name: tenantflow-db
    environment:
      POSTGRES_DB: tenantflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tenantflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  tenantflow-api:
    build: .
    container_name: tenantflow-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tenantflow
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: